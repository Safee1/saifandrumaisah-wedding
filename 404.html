<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found — Saif &amp; Rumaisah</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root { --bg: #faf7f2; --ink: #223049; --muted: #6e7787; --side: #40587a; --line: rgba(125,149,181,0.55); }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Cormorant Garamond', Georgia, serif;
    background: var(--bg); color: var(--ink); text-align: center;
    min-height: 100svh; display: flex; align-items: center; justify-content: center;
    padding: 2rem 1.25rem;
  }
  .wrap { max-width: 380px; }
  .amp { font-family: 'Pinyon Script', cursive; font-size: clamp(2.4rem, 9vw, 3.2rem); color: var(--side); display: block; margin: 0.5rem 0; }
  h1 { font-weight: 400; font-size: clamp(1.6rem, 6vw, 2.1rem); margin: 0; }
  p { font-style: italic; color: var(--muted); margin: 1.2rem 0 1.8rem; }
  a { font-family: Georgia, serif; font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--side); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
  a:hover { color: var(--ink); border-color: var(--ink); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>This page wandered off</h1>
    <span class="amp">&amp;</span>
    <p>we couldn't find it — but the invitation's still waiting for you.</p>
    <a href="/">&larr; Back to the invitation</a>
  </div>
</body>
</html>
