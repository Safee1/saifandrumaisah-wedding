<script>
  // GitHub Pages is case-sensitive and rejects a trailing slash: send near-miss
  // URLs (/RSVP.html, /rsvp/) to the real page. Only ever redirects to a fixed
  // list, never to anything taken from the request, and never loops.
  (function () {
    try {
      var p = location.pathname;
      var fixed = p.toLowerCase().replace(/\/+$/, "");
      var pages = {
        "": "/", "/index": "/", "/index.html": "/",
        "/rsvp": "/rsvp.html", "/rsvp.html": "/rsvp.html",
        "/add-to-tree": "/add-to-tree.html", "/add-to-tree.html": "/add-to-tree.html",
        "/privacy": "/privacy.html", "/privacy.html": "/privacy.html"
      };
      if (fixed !== p && Object.prototype.hasOwnProperty.call(pages, fixed)) {
        location.replace(pages[fixed] + location.search + location.hash);
      }
    } catch (e) {}
  })();
