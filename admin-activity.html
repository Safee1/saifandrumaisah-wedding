<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#faf7f2">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Private ops activity log for Saif &amp; Rumaisah's wedding site.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://rfopieelzxvnmfhdvqqf.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Activity log — Saif &amp; Rumaisah</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="manifest" href="site.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #faf7f2; --card: #fffdf9; --ink: #223049; --muted: #636c7c;
    --accent: #7d95b5; --gold: #b99668; --side: #40587a;
    --good: #4d7a5a; --bad: #a1503f;
  }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Cormorant Garamond', Georgia, serif; background: var(--bg); color: var(--ink); min-height: 100svh; }

  .gate { min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 2rem 1.25rem; }
  .gate-box { width: 100%; max-width: 340px; text-align: center; }
  .gate-box h1 { font-family: 'Pinyon Script', cursive; font-weight: 400; font-size: 2.2rem; margin: 0 0 1.4rem; }
  .gate-box input { width: 100%; font-family: inherit; font-size: 1rem; padding: 0.7rem 0.9rem; border-radius: 10px; border: 1px solid rgba(64,88,122,0.3); margin-bottom: 0.8rem; }
  .gate-box button { width: 100%; padding: 0.75rem; border: none; border-radius: 10px; background: var(--side); color: #fff; font-family: inherit; font-size: 1rem; letter-spacing: 0.05em; cursor: pointer; }
  .gate-err { color: var(--bad); font-size: 0.85rem; margin-top: 0.6rem; min-height: 1.2em; }

  .app { display: none; max-width: 780px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  .app.show { display: block; }
  .eyebrow { text-align: center; font-size: 0.75rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--muted); margin: 0 0 0.4rem; }
  h1.title { text-align: center; font-family: 'Pinyon Script', cursive; font-weight: 400; font-size: 2.2rem; margin: 0 0 1.5rem; }
  nav.admin-nav { text-align: center; margin-bottom: 1.5rem; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; }
  nav.admin-nav a { color: var(--side); text-decoration: none; margin: 0 0.6rem; }
  nav.admin-nav a:hover { text-decoration: underline; }

  .stats { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .stat { flex: 1 1 140px; background: var(--card); border: 1px solid rgba(185,150,104,0.3); border-radius: 12px; padding: 0.9rem 1rem; text-align: center; }
  .stat .num { font-size: 1.6rem; font-weight: 600; color: var(--side); display: block; }
  .stat .label { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

  .controls { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; margin-bottom: 1.25rem; }
  .controls select, .controls button { font-family: inherit; font-size: 0.88rem; padding: 0.45rem 0.7rem; border-radius: 8px; border: 1px solid rgba(64,88,122,0.3); background: #fff; }
  .controls button { cursor: pointer; background: var(--side); color: #fff; border: none; }
  .controls button.secondary { background: none; color: var(--side); border: 1px solid var(--side); }

  .empty { text-align: center; color: var(--muted); font-style: italic; padding: 3rem 1rem; }
  .row { display: flex; gap: 1rem; align-items: baseline; padding: 0.6rem 0; border-bottom: 1px solid rgba(185,150,104,0.2); }
  .row .when { flex: 0 0 130px; font-size: 0.78rem; color: var(--muted); }
  .row .kind { flex: 0 0 150px; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--side); }
  .row .summary { flex: 1; font-size: 0.98rem; overflow-wrap: anywhere; }
  .row.bad .kind { color: var(--bad); }

  .tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: center; margin-bottom: 1.5rem; }
  .tabs button { font-family: inherit; font-size: 0.85rem; padding: 0.45rem 0.9rem; border-radius: 999px; border: 1px solid rgba(64,88,122,0.3); background: #fff; color: var(--side); cursor: pointer; }
  .tabs button.active { background: var(--side); color: #fff; border-color: var(--side); }
  .pane { display: none; }
  .pane.active { display: block; }

  .bl-row { display: flex; gap: 0.9rem; align-items: flex-start; padding: 0.75rem 0; border-bottom: 1px solid rgba(185,150,104,0.2); }
  .bl-row .bl-main { flex: 1; }
  .bl-row .bl-name { font-weight: 600; }
  .bl-row .bl-msg { font-size: 0.95rem; color: var(--ink); margin: 0.2rem 0; overflow-wrap: anywhere; }
  .bl-row .bl-meta { font-size: 0.75rem; color: var(--muted); }
  .bl-row .bl-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .bl-row .bl-actions button { font-family: inherit; font-size: 0.8rem; padding: 0.35rem 0.6rem; border-radius: 8px; border: 1px solid rgba(64,88,122,0.3); background: #fff; cursor: pointer; }
  .bl-row .bl-actions select { font-family: inherit; font-size: 0.78rem; padding: 0.3rem; border-radius: 8px; border: 1px solid rgba(64,88,122,0.3); }
  .bl-status-pending .bl-name::after { content: " (held)"; color: var(--bad); font-weight: 400; font-size: 0.75rem; }
  .bl-status-hidden .bl-name::after { content: " (hidden)"; color: var(--muted); font-weight: 400; font-size: 0.75rem; }

  .ma-box textarea { width: 100%; min-height: 140px; font-family: inherit; font-size: 0.95rem; padding: 0.7rem; border-radius: 10px; border: 1px solid rgba(64,88,122,0.3); }
  .ma-box input[type="text"] { width: 100%; font-family: inherit; font-size: 0.95rem; padding: 0.6rem 0.7rem; border-radius: 10px; border: 1px solid rgba(64,88,122,0.3); margin-bottom: 0.6rem; }
  .ma-box button { font-family: inherit; font-size: 0.9rem; padding: 0.55rem 1rem; border-radius: 8px; border: none; background: var(--side); color: #fff; cursor: pointer; margin-right: 0.5rem; margin-top: 0.6rem; }
  .ma-box button.secondary { background: none; color: var(--side); border: 1px solid var(--side); }
  .ma-status { font-size: 0.85rem; margin-top: 0.6rem; min-height: 1.2em; }
  .ma-preview { border: 1px dashed rgba(185,150,104,0.4); border-radius: 10px; padding: 0.9rem; margin-top: 0.8rem; display: none; }
</style>
</head>
<body>
  <div class="gate" id="gate">
    <div class="gate-box">
      <h1>activity</h1>
      <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
      <button id="pwSubmit">Unlock</button>
      <p class="gate-err" id="gateErr"></p>
    </div>
  </div>

  <div class="app" id="app">
    <p class="eyebrow">how the site is doing</p>
    <h1 class="title">activity log</h1>
    <nav class="admin-nav">
      <a href="tree-admin.html">Tree review</a>
      <a href="rsvp-admin.html">RSVPs</a>
    </nav>

    <div class="tabs">
      <button type="button" class="tab-btn active" data-tab="activity">Activity</button>
      <button type="button" class="tab-btn" data-tab="blessings">Blessings</button>
      <button type="button" class="tab-btn" data-tab="emails">Emails</button>
      <button type="button" class="tab-btn" data-tab="messageall">Message all guests</button>
    </div>

    <div class="pane active" id="pane-activity">
      <div class="stats" id="stats"></div>

      <div class="controls">
        <select id="kindFilter">
          <option value="">All kinds</option>
          <option value="rsvp_submitted">RSVP submitted</option>
          <option value="tree_submitted">Tree submission</option>
          <option value="blessing_submitted">Blessing submitted</option>
          <option value="person_approved">Person approved</option>
          <option value="person_rejected">Person rejected</option>
          <option value="person_restored">Person restored</option>
          <option value="blessing_approved">Blessing approved</option>
          <option value="blessing_hidden">Blessing hidden</option>
          <option value="admin_login_ok">Admin login ok</option>
          <option value="admin_login_failed">Admin login failed</option>
          <option value="admin_lockout">Admin lockout</option>
        </select>
        <button id="refreshBtn" class="secondary">Refresh</button>
        <button id="csvBtn" class="secondary">Export CSV</button>
      </div>

      <div id="list"></div>
    </div>

    <div class="pane" id="pane-blessings">
      <div class="controls">
        <select id="blFilter">
          <option value="pending">Pending (held)</option>
          <option value="approved">Approved</option>
          <option value="hidden">Hidden</option>
        </select>
        <button id="blRefresh" class="secondary">Refresh</button>
      </div>
      <div id="blList"></div>
    </div>

    <div class="pane" id="pane-emails">
      <div class="controls">
        <button id="emRefresh" class="secondary">Refresh</button>
      </div>
      <div id="emList"></div>
    </div>

    <div class="pane" id="pane-messageall">
      <div class="ma-box">
        <input type="text" id="maSubject" placeholder="Subject">
        <textarea id="maBody" placeholder="Write the message… (plain text is fine, we'll wrap it in the wedding template)"></textarea>
        <div>
          <button id="maPreviewBtn" class="secondary" type="button">Preview</button>
          <button id="maTestBtn" class="secondary" type="button">Send test to us</button>
          <button id="maSendBtn" type="button">Send to all guests</button>
        </div>
        <p class="ma-status" id="maStatus"></p>
        <div class="ma-preview" id="maPreview"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var SUPABASE_URL = "https://rfopieelzxvnmfhdvqqf.supabase.co";
      var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJmb3BpZWVsenh2bm1maGR2cXFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NDA4MDcsImV4cCI6MjEwMjMxNjgwN30.B7QgmJbG4CC457U4KP3OtCjrveJ7kpFjk2y2GtL5b24";

      function rpc(fn, args) {
        return fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {
          method: "POST",
          headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "Content-Type": "application/json" },
          body: JSON.stringify(args || {})
        }).then(function (r) {
          if (!r.ok) {
            return r.json().catch(function () { return null; }).then(function (body) {
              var msg = (body && (body.message || body.hint)) || ("Request failed (" + r.status + ")");
              throw new Error(msg);
            });
          }
          return r.text().then(function (t) { return t ? JSON.parse(t) : null; });
        });
      }

      var pw = null;
      var allRows = [];
      var gate = document.getElementById("gate");
      var app = document.getElementById("app");
      var pwInput = document.getElementById("pw");
      var pwSubmit = document.getElementById("pwSubmit");
      var gateErr = document.getElementById("gateErr");
      var list = document.getElementById("list");
      var statsEl = document.getElementById("stats");
      var kindFilter = document.getElementById("kindFilter");
      var refreshBtn = document.getElementById("refreshBtn");
      var csvBtn = document.getElementById("csvBtn");

      function lockoutMessage(err) {
        var msg = err && err.message;
        return msg && msg.indexOf("Too many attempts") !== -1 ? msg : null;
      }

      function unlock() {
        var candidate = pwInput.value;
        if (!candidate) { return; }
        pwSubmit.disabled = true;
        gateErr.textContent = "";
        rpc("admin_list_activity", { pw: candidate, p_limit: 1000 })
          .then(function (rows) {
            pw = candidate;
            gate.style.display = "none";
            app.classList.add("show");
            render(rows);
          })
          .catch(function (err) {
            gateErr.textContent = lockoutMessage(err) || "Wrong password.";
            pwSubmit.disabled = false;
          });
      }

      pwSubmit.addEventListener("click", unlock);
      pwInput.addEventListener("keydown", function (e) { if (e.key === "Enter") { unlock(); } });

      function load() {
        list.innerHTML = "<p class=\"empty\">Loading…</p>";
        rpc("admin_list_activity", { pw: pw, p_limit: 1000 })
          .then(render)
          .catch(function () { list.innerHTML = "<p class=\"empty\">Couldn&rsquo;t load &mdash; tap Refresh to try again.</p>"; });
      }
      refreshBtn.addEventListener("click", load);
      kindFilter.addEventListener("change", function () { renderList(); });

      function render(rows) {
        allRows = rows || [];
        renderStats();
        renderList();
      }

      function renderStats() {
        var now = Date.now();
        var day = 24 * 60 * 60 * 1000;
        var today = allRows.filter(function (r) { return now - new Date(r.created_at).getTime() < day; });
        var week = allRows.filter(function (r) { return now - new Date(r.created_at).getTime() < 7 * day; });
        function count(rows, kind) { return rows.filter(function (r) { return r.kind === kind; }).length; }

        var cards = [
          { label: "New RSVPs (today)", num: count(today, "rsvp_submitted") },
          { label: "New RSVPs (7 days)", num: count(week, "rsvp_submitted") },
          { label: "Tree pending", num: count(week, "tree_submitted") },
          { label: "Failed logins (7 days)", num: count(week, "admin_login_failed") + count(week, "admin_lockout") }
        ];
        statsEl.innerHTML = "";
        cards.forEach(function (c) {
          var el = document.createElement("div");
          el.className = "stat";
          var num = document.createElement("span");
          num.className = "num";
          num.textContent = c.num;
          var label = document.createElement("span");
          label.className = "label";
          label.textContent = c.label;
          el.appendChild(num);
          el.appendChild(label);
          statsEl.appendChild(el);
        });
      }

      function renderList() {
        var filter = kindFilter.value;
        var rows = filter ? allRows.filter(function (r) { return r.kind === filter; }) : allRows;
        list.innerHTML = "";
        if (!rows.length) {
          list.innerHTML = "<p class=\"empty\">Nothing here yet.</p>";
          return;
        }
        rows.forEach(function (r) {
          var el = document.createElement("div");
          el.className = "row" + (r.kind.indexOf("failed") !== -1 || r.kind.indexOf("lockout") !== -1 || r.kind.indexOf("rejected") !== -1 ? " bad" : "");
          var when = document.createElement("span");
          when.className = "when";
          when.textContent = new Date(r.created_at).toLocaleString();
          var kind = document.createElement("span");
          kind.className = "kind";
          kind.textContent = r.kind.replace(/_/g, " ");
          var summary = document.createElement("span");
          summary.className = "summary";
          summary.textContent = r.summary;
          el.appendChild(when);
          el.appendChild(kind);
          el.appendChild(summary);
          list.appendChild(el);
        });
      }

      function csvEscape(v) {
        var s = String(v == null ? "" : v);
        if (/[",\n]/.test(s)) { s = '"' + s.replace(/"/g, '""') + '"'; }
        return s;
      }

      csvBtn.addEventListener("click", function () {
        var filter = kindFilter.value;
        var rows = filter ? allRows.filter(function (r) { return r.kind === filter; }) : allRows;
        var lines = ["created_at,kind,summary,ref_id"];
        rows.forEach(function (r) {
          lines.push([csvEscape(r.created_at), csvEscape(r.kind), csvEscape(r.summary), csvEscape(r.ref_id)].join(","));
        });
        var blob = new Blob([lines.join("\n")], { type: "text/csv" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "activity-log-" + new Date().toISOString().slice(0, 10) + ".csv";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });

      // --- tabs ---
      var tabButtons = document.querySelectorAll(".tab-btn");
      var panes = document.querySelectorAll(".pane");
      tabButtons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          tabButtons.forEach(function (b) { b.classList.remove("active"); });
          panes.forEach(function (p) { p.classList.remove("active"); });
          btn.classList.add("active");
          document.getElementById("pane-" + btn.getAttribute("data-tab")).classList.add("active");
          if (btn.getAttribute("data-tab") === "blessings") { loadBlessings(); }
          if (btn.getAttribute("data-tab") === "emails") { loadEmails(); }
        });
      });

      // --- blessings moderation ---
      var THEME_OPTIONS = [
        ["congratulations", "congratulations"], ["cant_wait", "can't wait"],
        ["will_be_there", "will be there"], ["duas", "duas & prayers"], ["love", "love"]
      ];
      var blList = document.getElementById("blList");
      var blFilter = document.getElementById("blFilter");
      document.getElementById("blRefresh").addEventListener("click", loadBlessings);
      blFilter.addEventListener("change", loadBlessings);

      function loadBlessings() {
        if (!pw) { return; }
        blList.innerHTML = "<p class=\"empty\">Loading…</p>";
        var status = blFilter.value;
        // Anon has no SELECT on pending/hidden rows or on email/moderation_reason,
        // so this goes through a SECURITY DEFINER RPC gated by admin_check,
        // same pattern as every other admin list on this site.
        rpc("admin_list_blessings_full", { pw: pw, filter_status: status }).then(function (rows) {
          renderBlessings(rows || []);
        }).catch(function () {
          blList.innerHTML = "<p class=\"empty\">Couldn&rsquo;t load &mdash; tap Refresh to try again.</p>";
        });
      }

      function renderBlessings(rows) {
        blList.innerHTML = "";
        if (!rows.length) { blList.innerHTML = "<p class=\"empty\">Nothing here.</p>"; return; }
        rows.forEach(function (row) {
          var el = document.createElement("div");
          el.className = "bl-row bl-status-" + row.status;
          var main = document.createElement("div");
          main.className = "bl-main";
          var name = document.createElement("div");
          name.className = "bl-name";
          name.textContent = row.name;
          var msg = document.createElement("div");
          msg.className = "bl-msg";
          msg.textContent = row.message;
          var meta = document.createElement("div");
          meta.className = "bl-meta";
          meta.textContent = new Date(row.created_at).toLocaleString() + (row.moderation_reason ? " — held for: " + row.moderation_reason : "");
          main.appendChild(name); main.appendChild(msg); main.appendChild(meta);

          var actions = document.createElement("div");
          actions.className = "bl-actions";
          var themeSel = document.createElement("select");
          THEME_OPTIONS.forEach(function (t) {
            var o = document.createElement("option");
            o.value = t[0]; o.textContent = t[1];
            if (row.theme === t[0]) { o.selected = true; }
            themeSel.appendChild(o);
          });
          actions.appendChild(themeSel);

          function act(status) {
            rpc("admin_set_blessing_status", { pw: pw, target: row.id, new_status: status, new_theme: themeSel.value })
              .then(loadBlessings)
              .catch(function () { alert("Couldn't update that blessing."); });
          }
          if (row.status !== "approved") {
            var approveBtn = document.createElement("button");
            approveBtn.textContent = "Approve";
            approveBtn.addEventListener("click", function () { act("approved"); });
            actions.appendChild(approveBtn);
          }
          if (row.status !== "hidden") {
            var hideBtn = document.createElement("button");
            hideBtn.textContent = "Hide";
            hideBtn.addEventListener("click", function () { act("hidden"); });
            actions.appendChild(hideBtn);
          }
          if (row.status === "hidden") {
            var restoreBtn = document.createElement("button");
            restoreBtn.textContent = "Restore";
            restoreBtn.addEventListener("click", function () { act("approved"); });
            actions.appendChild(restoreBtn);
          }
          var saveThemeBtn = document.createElement("button");
          saveThemeBtn.textContent = "Save theme";
          saveThemeBtn.addEventListener("click", function () { act(row.status); });
          actions.appendChild(saveThemeBtn);

          el.appendChild(main);
          el.appendChild(actions);
          blList.appendChild(el);
        });
      }

      // --- emails tab ---
      var emList = document.getElementById("emList");
      document.getElementById("emRefresh").addEventListener("click", loadEmails);
      function loadEmails() {
        if (!pw) { return; }
        emList.innerHTML = "<p class=\"empty\">Loading…</p>";
        rpc("admin_list_email_log", { pw: pw, limit_n: 300 }).then(function (rows) {
          emList.innerHTML = "";
          if (!rows || !rows.length) { emList.innerHTML = "<p class=\"empty\">No emails sent yet.</p>"; return; }
          rows.forEach(function (r) {
            var el = document.createElement("div");
            el.className = "row" + (r.status === "failed" || r.status === "bounced" || r.status === "complained" ? " bad" : "");
            var when = document.createElement("span");
            when.className = "when";
            when.textContent = new Date(r.created_at).toLocaleString();
            var kind = document.createElement("span");
            kind.className = "kind";
            kind.textContent = r.kind.replace(/_/g, " ") + " — " + r.status;
            var summary = document.createElement("span");
            summary.className = "summary";
            summary.textContent = r.to_email;
            el.appendChild(when); el.appendChild(kind); el.appendChild(summary);
            emList.appendChild(el);
          });
        }).catch(function () {
          emList.innerHTML = "<p class=\"empty\">Couldn&rsquo;t load &mdash; tap Refresh to try again.</p>";
        });
      }

      // --- message all guests: preview -> test -> explicit confirm -> send ---
      var maSubject = document.getElementById("maSubject");
      var maBody = document.getElementById("maBody");
      var maPreviewBtn = document.getElementById("maPreviewBtn");
      var maTestBtn = document.getElementById("maTestBtn");
      var maSendBtn = document.getElementById("maSendBtn");
      var maStatus = document.getElementById("maStatus");
      var maPreview = document.getElementById("maPreview");
      var testSentOk = false;

      function wrapMessage(bodyText) {
        var escaped = String(bodyText || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        var html = escaped.split(/\n{2,}/).map(function (p) {
          return "<p style=\"line-height:1.7;margin:0 0 14px;\">" + p.replace(/\n/g, "<br>") + "</p>";
        }).join("");
        return (
          "<div style=\"background:#f7f1e6;padding:32px 16px;font-family:'Cormorant Garamond',Georgia,serif;color:#3b332a;\">" +
          "<div style=\"max-width:520px;margin:0 auto;background:#fffdf8;border:1px solid rgba(185,150,104,0.35);border-radius:14px;padding:36px 28px;\">" +
          html +
          "<div style=\"height:1px;margin:22px 0;background:linear-gradient(90deg,transparent,rgba(185,150,104,0.55),transparent);\"></div>" +
          "<p style=\"text-align:center;font-size:0.85rem;color:#8a7f6f;margin:0;\">&mdash; two families, one story &mdash;<br>saifandrumaisah.com</p>" +
          "</div></div>"
        );
      }

      maPreviewBtn.addEventListener("click", function () {
        maPreview.innerHTML = wrapMessage(maBody.value);
        maPreview.style.display = "block";
      });

      function callNotify(payload) {
        return fetch(SUPABASE_URL + "/functions/v1/notify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        }).then(function (r) { return r.json().catch(function () { return {}; }); });
      }

      maTestBtn.addEventListener("click", function () {
        if (!pw || !maSubject.value || !maBody.value) { maStatus.textContent = "Write a subject and message first."; return; }
        maStatus.textContent = "Sending test…";
        callNotify({ kind: "message_all", adminPw: pw, subject: maSubject.value, html: wrapMessage(maBody.value), text: maBody.value, test: true })
          .then(function (res) {
            if (res.sent) { testSentOk = true; maStatus.textContent = "Test sent to us. Check it, then Send to all guests when ready."; }
            else { maStatus.textContent = res.reason === "notifications not configured" ? "Email isn't switched on yet (no RESEND_API_KEY) — nothing was sent." : "Test didn't send — try again."; }
          })
          .catch(function () { maStatus.textContent = "Test didn't send — try again."; });
      });

      maSendBtn.addEventListener("click", function () {
        if (!pw || !maSubject.value || !maBody.value) { maStatus.textContent = "Write a subject and message first."; return; }
        if (!testSentOk) { maStatus.textContent = "Send yourself a test first, and check it, before sending to every guest."; return; }
        if (!confirm("Send \"" + maSubject.value + "\" to every guest who gave an email? This can't be undone.")) { return; }
        maSendBtn.disabled = true;
        maStatus.textContent = "Sending to all guests…";
        callNotify({ kind: "message_all", adminPw: pw, subject: maSubject.value, html: wrapMessage(maBody.value), text: maBody.value, test: false })
          .then(function (res) {
            maSendBtn.disabled = false;
            if (res.sent) { maStatus.textContent = "Sent to " + (res.sentCount || 0) + " of " + (res.count || 0) + " guests."; testSentOk = false; }
            else { maStatus.textContent = res.reason || "Didn't send — try again."; }
          })
          .catch(function () { maSendBtn.disabled = false; maStatus.textContent = "Didn't send — try again."; });
      });
    })();
  </script>
</body>
</html>
