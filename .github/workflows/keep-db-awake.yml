name: keep-db-awake

# Keeps the free Supabase project from pausing and says so loudly if the
# tree or database looks unhealthy.
#
# Supabase pauses Free projects with low activity over 7 days; its docs say
# "a few user requests to the database each day" is enough to stop that, so
# this runs twice a day (at an off-peak minute: GitHub runs scheduled jobs
# 5-8 hours late around 06:00 UTC, and can drop a run under load).
#
# GitHub switches OFF scheduled workflows in a public repo with no repository
# activity for 60 days. A commit-based "heartbeat" cannot work here (main only
# accepts pull requests), so the stay-enabled job re-enables this workflow
# through the API on every run, and the optional HC_PING_URL secret (a free
# healthchecks.io check) e-mails the owners if the pings ever stop arriving,
# whatever the reason. If the tree ever goes blank, check the Actions tab first.

on:
  schedule:
    - cron: "43 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-db-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HC_PING_URL: ${{ secrets.HC_PING_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Call public_tree() and check the tree is not blank
        run: bash scripts/keep-db-awake.sh
      - name: Tell the dead-man's switch we are alive
        if: success() && env.HC_PING_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_PING_URL" > /dev/null
      - name: Tell the dead-man's switch we failed
        if: failure() && env.HC_PING_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_PING_URL/fail" > /dev/null || true

  stay-enabled:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow so GitHub's 60-day inactivity timer restarts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable keep-db-awake.yml --repo "$GITHUB_REPOSITORY"
