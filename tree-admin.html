<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#faf7f2">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="base-uri 'self';">
<title>Review tree submissions — Saif &amp; Rumaisah</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #faf7f2; --card: #fffdf9; --ink: #223049; --muted: #6e7787;
    --accent: #7d95b5; --gold: #b99668; --env: #f5efe4; --side: #40587a;
    --good: #4d7a5a; --bad: #a1503f;
  }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Cormorant Garamond', Georgia, serif; background: var(--bg); color: var(--ink); min-height: 100svh; }

  .gate { min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 2rem 1.25rem; }
  .gate-box { width: 100%; max-width: 340px; text-align: center; }
  .gate-box h1 { font-family: 'Pinyon Script', cursive; font-weight: 400; font-size: 2.2rem; margin: 0 0 1.4rem; }
  .gate-box input { width: 100%; font-family: inherit; font-size: 1rem; padding: 0.7rem 0.9rem; border-radius: 10px; border: 1px solid rgba(64,88,122,0.3); margin-bottom: 0.8rem; }
  .gate-box button { width: 100%; padding: 0.75rem; border: none; border-radius: 10px; background: var(--side); color: #fff; font-family: inherit; font-size: 1rem; letter-spacing: 0.05em; cursor: pointer; }
  .gate-err { color: var(--bad); font-size: 0.85rem; margin-top: 0.6rem; min-height: 1.2em; }

  .app { display: none; max-width: 720px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  .app.show { display: block; }
  .eyebrow { text-align: center; font-size: 0.75rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--muted); margin: 0 0 0.4rem; }
  h1.title { text-align: center; font-family: 'Pinyon Script', cursive; font-weight: 400; font-size: 2.2rem; margin: 0 0 2rem; }

  .empty { text-align: center; color: var(--muted); font-style: italic; padding: 3rem 1rem; }
  .item { background: var(--card); border: 1px solid rgba(185,150,104,0.3); border-radius: 14px; padding: 1.1rem 1.25rem; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .item-info { flex: 1 1 240px; min-width: 0; }
  .item-kind { font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--side); margin: 0 0 0.25rem; }
  .item-main { font-size: 1.1rem; margin: 0; overflow-wrap: anywhere; }
  .item-note { font-size: 0.85rem; color: var(--muted); font-style: italic; margin: 0.2rem 0 0; overflow-wrap: anywhere; }
  .item-actions { display: flex; gap: 0.5rem; }
  .item-actions button { font-family: inherit; font-size: 0.85rem; letter-spacing: 0.05em; border: none; border-radius: 8px; padding: 0.5rem 0.9rem; cursor: pointer; }
  .btn-approve { background: var(--good); color: #fff; }
  .btn-reject { background: transparent; color: var(--bad); border: 1px solid var(--bad) !important; }
  .item-actions button:disabled { opacity: 0.5; cursor: default; }

  .refresh { display: block; margin: 0 auto 1.5rem; font-family: inherit; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--side); background: none; border: 1px solid var(--side); border-radius: 8px; padding: 0.5rem 1rem; cursor: pointer; }
</style>
</head>
<body>
  <div class="gate" id="gate">
    <div class="gate-box">
      <h1>review</h1>
      <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
      <button id="pwSubmit">Unlock</button>
      <p class="gate-err" id="gateErr"></p>
    </div>
  </div>

  <div class="app" id="app">
    <p class="eyebrow">our family tree</p>
    <h1 class="title">pending submissions</h1>
    <button class="refresh" id="refreshBtn">Refresh</button>
    <div id="list"></div>
  </div>

  <script src="js/tree-data.js?v=26"></script>
  <script>
    (function () {
      var pw = null;
      var gate = document.getElementById("gate");
      var app = document.getElementById("app");
      var pwInput = document.getElementById("pw");
      var pwSubmit = document.getElementById("pwSubmit");
      var gateErr = document.getElementById("gateErr");
      var list = document.getElementById("list");
      var refreshBtn = document.getElementById("refreshBtn");

      // each load gets a generation number so a slow, stale response
      // can never repaint (or duplicate) a newer list
      var renderSeq = 0;

      function unlock() {
        var candidate = pwInput.value;
        if (!candidate) { return; }
        pwSubmit.disabled = true;
        gateErr.textContent = "";
        TreeData.rpc("admin_list_pending", { pw: candidate })
          .then(function (rows) {
            pw = candidate;
            gate.style.display = "none";
            app.classList.add("show");
            try { sessionStorage.setItem("treeAdminPw", candidate); } catch (e) {}
            renderAll(rows, ++renderSeq);
          })
          .catch(function () {
            gateErr.textContent = "Wrong password.";
            pwSubmit.disabled = false;
          });
      }

      pwSubmit.addEventListener("click", unlock);
      pwInput.addEventListener("keydown", function (e) { if (e.key === "Enter") { unlock(); } });

      function loadPending() {
        var seq = ++renderSeq;
        list.innerHTML = "<p class=\"empty\">Loading…</p>";
        TreeData.rpc("admin_list_pending", { pw: pw }).then(function (rows) {
          if (seq !== renderSeq) { return; }
          renderAll(rows, seq);
        }).catch(function () {
          if (seq !== renderSeq) { return; }
          list.innerHTML = "<p class=\"empty\">Couldn&rsquo;t load &mdash; tap Refresh to try again.</p>";
        });
      }

      refreshBtn.addEventListener("click", loadPending);

      function buildTreeItem(row) {
        var el = document.createElement("div");
        el.className = "item";

        var info = document.createElement("div");
        info.className = "item-info";
        var kind = document.createElement("p");
        kind.className = "item-kind";
        var main = document.createElement("p");
        main.className = "item-main";

        if (row.kind === "person") {
          kind.textContent = (row.side === "saif" ? "Saif's side" : "Rumaisah's side") + (row.is_kid ? " · little one" : "");
          main.textContent = row.name;
        } else {
          kind.textContent = "relationship";
          var verb = row.rel_type === "spouse_of" ? "married to"
            : row.rel_type === "sibling_of" ? "sibling of" : "parent of";
          main.textContent = row.from_person_name + " — " + verb + " — " + row.to_person_name;
        }
        info.appendChild(kind);
        info.appendChild(main);
        if (row.submitted_note) {
          var note = document.createElement("p");
          note.className = "item-note";
          note.textContent = "From: " + row.submitted_note;
          info.appendChild(note);
        }

        var actions = document.createElement("div");
        actions.className = "item-actions";
        var approveBtn = document.createElement("button");
        approveBtn.className = "btn-approve";
        approveBtn.textContent = "Approve";
        var rejectBtn = document.createElement("button");
        rejectBtn.className = "btn-reject";
        rejectBtn.textContent = "Reject";

        function act(status) {
          approveBtn.disabled = true;
          rejectBtn.disabled = true;
          var fn = row.kind === "person" ? "admin_set_person_status" : "admin_set_relationship_status";
          TreeData.rpc(fn, { pw: pw, target: row.id, new_status: status })
            .then(function () { el.remove(); })
            .catch(function () {
              approveBtn.disabled = false;
              rejectBtn.disabled = false;
              alert("Something went wrong — please try again.");
            });
        }
        approveBtn.addEventListener("click", function () { act("approved"); });
        rejectBtn.addEventListener("click", function () { act("rejected"); });

        actions.appendChild(approveBtn);
        actions.appendChild(rejectBtn);
        el.appendChild(info);
        el.appendChild(actions);
        return el;
      }

      function buildBlessingItem(row) {
        var el = document.createElement("div");
        el.className = "item";

        var info = document.createElement("div");
        info.className = "item-info";
        var kind = document.createElement("p");
        kind.className = "item-kind";
        kind.textContent = "blessing";
        var main = document.createElement("p");
        main.className = "item-main";
        main.textContent = row.message;
        var note = document.createElement("p");
        note.className = "item-note";
        note.textContent = "— " + row.name;
        info.appendChild(kind);
        info.appendChild(main);
        info.appendChild(note);

        var actions = document.createElement("div");
        actions.className = "item-actions";
        var approveBtn = document.createElement("button");
        approveBtn.className = "btn-approve";
        approveBtn.textContent = "Approve";
        var rejectBtn = document.createElement("button");
        rejectBtn.className = "btn-reject";
        rejectBtn.textContent = "Reject";

        function act(status) {
          approveBtn.disabled = true;
          rejectBtn.disabled = true;
          TreeData.rpc("admin_set_blessing_status", { pw: pw, target: row.id, new_status: status })
            .then(function () { el.remove(); })
            .catch(function () {
              approveBtn.disabled = false;
              rejectBtn.disabled = false;
              alert("Something went wrong — please try again.");
            });
        }
        approveBtn.addEventListener("click", function () { act("approved"); });
        rejectBtn.addEventListener("click", function () { act("rejected"); });

        actions.appendChild(approveBtn);
        actions.appendChild(rejectBtn);
        el.appendChild(info);
        el.appendChild(actions);
        return el;
      }

      function renderAll(treeRows, seq) {
        list.innerHTML = "";
        treeRows.forEach(function (row) { list.appendChild(buildTreeItem(row)); });
        TreeData.rpc("admin_list_blessings", { pw: pw })
          .then(function (blessingRows) {
            if (seq !== renderSeq) { return; }
            blessingRows.forEach(function (row) { list.appendChild(buildBlessingItem(row)); });
            if (!treeRows.length && !blessingRows.length) {
              list.innerHTML = "<p class=\"empty\">Nothing waiting &mdash; all caught up.</p>";
            }
          })
          .catch(function () {
            if (seq !== renderSeq) { return; }
            var msg = document.createElement("p");
            msg.className = "empty";
            msg.textContent = "Blessings couldn't load — tap Refresh to try again.";
            list.appendChild(msg);
          });
      }

      try {
        var saved = sessionStorage.getItem("treeAdminPw");
        if (saved) { pwInput.value = saved; unlock(); }
      } catch (e) {}
    })();
  </script>
</body>
</html>
