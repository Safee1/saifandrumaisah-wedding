<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#faf7f2">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="base-uri 'self';">
<title>Add to the family tree — Saif &amp; Rumaisah</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #faf7f2; --card: #fffdf9; --ink: #223049; --muted: #6e7787;
    --accent: #7d95b5; --gold: #b99668; --env: #f5efe4; --side: #40587a;
    --line: rgba(125,149,181,0.55); --good: #4d7a5a; --bad: #a1503f;
  }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Cormorant Garamond', Georgia, serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 1.25rem;
  }
  .wrap { width: 100%; max-width: 460px; }
  .eyebrow { text-align: center; font-size: 0.75rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--muted); margin: 0 0 0.6rem; font-weight: 500; }
  h1 { text-align: center; font-family: 'Pinyon Script', cursive; font-weight: 400; font-size: clamp(2rem, 8vw, 2.6rem); margin: 0 0 0.3rem; color: var(--ink); }
  .sub { text-align: center; font-style: italic; color: var(--muted); font-size: 0.95rem; margin: 0 0 2rem; line-height: 1.5; }

  form { background: var(--card); border: 1px solid rgba(185,150,104,0.3); border-radius: 18px; padding: 1.75rem 1.5rem; }
  .field { margin-bottom: 1.3rem; }
  label { display: block; font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--side); font-weight: 500; margin-bottom: 0.45rem; }
  input[type="text"], select, textarea {
    width: 100%; font-family: inherit; font-size: 1rem; color: var(--ink);
    background: #fff; border: 1px solid rgba(64,88,122,0.25); border-radius: 10px;
    padding: 0.65rem 0.8rem; outline: none;
  }
  input[type="text"]:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(125,149,181,0.15); }
  textarea { resize: vertical; min-height: 3.2rem; }
  .hint { font-size: 0.78rem; color: var(--muted); margin-top: 0.35rem; line-height: 1.4; }

  .kid-row { display: flex; align-items: center; gap: 0.5rem; }
  .kid-row input { width: auto; }
  .kid-row label { margin: 0; text-transform: none; letter-spacing: normal; font-weight: 400; font-size: 0.95rem; color: var(--ink); }

  button[type="submit"] {
    width: 100%; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.05rem; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase; color: #fff; background: var(--side);
    border: none; border-radius: 10px; padding: 0.85rem; cursor: pointer;
  }
  button[type="submit"]:disabled { opacity: 0.55; cursor: default; }
  button[type="submit"]:not(:disabled):hover { background: #324567; }

  .status { text-align: center; font-size: 0.9rem; margin-top: 1rem; min-height: 1.2em; }
  .status.ok { color: var(--good); }
  .status.err { color: var(--bad); }

  .back { display: block; text-align: center; margin-top: 1.6rem; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); text-decoration: none; }
  .back:hover { color: var(--side); }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">our family tree</p>
    <h1>add someone</h1>
    <p class="sub">Tell us who they are and how they connect — we'll add them once Saif &amp; Rumaisah approve it.</p>

    <form id="addForm">
      <div class="field">
        <label for="name">Their name</label>
        <input type="text" id="name" maxlength="60" required autocomplete="off">
      </div>

      <div class="field">
        <label for="linkTo">Connected to</label>
        <select id="linkTo" required>
          <option value="" disabled selected>Loading the tree…</option>
        </select>
        <p class="hint">Search isn't needed — pick whoever's already on the tree that this person connects to.</p>
      </div>

      <div class="field">
        <label for="relType">They are that person's…</label>
        <select id="relType" required>
          <option value="child">Child</option>
          <option value="parent">Parent</option>
          <option value="spouse">Husband / wife</option>
          <option value="sibling">Brother / sister</option>
        </select>
      </div>

      <div class="field">
        <label for="side">Which side of the family</label>
        <select id="side" required>
          <option value="saif">Saif's side</option>
          <option value="rumaisah">Rumaisah's side</option>
        </select>
      </div>

      <div class="field kid-row">
        <input type="checkbox" id="isKid">
        <label for="isKid">This is a child (little one)</label>
      </div>

      <div class="field">
        <label for="note">Your name (optional)</label>
        <input type="text" id="note" maxlength="120" placeholder="So we know who to thank" autocomplete="off">
      </div>

      <div style="position:absolute; left:-9999px" aria-hidden="true">
        <label for="website">Leave this field blank</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <button type="submit" id="submitBtn" disabled>Send for approval</button>
      <p class="status" id="statusMsg" aria-live="polite"></p>
    </form>

    <a class="back" href="index.html#family">&larr; back to the tree</a>
  </div>

  <script src="js/tree-data.js?v=32"></script>
  <script>
    (function () {
      var linkTo = document.getElementById("linkTo");
      var side = document.getElementById("side");
      var submitBtn = document.getElementById("submitBtn");
      var statusMsg = document.getElementById("statusMsg");
      var form = document.getElementById("addForm");
      var peopleById = {};

      function personLabel(p) {
        return p.name + " (" + (p.side === "saif" ? "Saif's side" : "Rumaisah's side") + ")";
      }

      TreeData.fetchApprovedTree().then(function (data) {
        var people = data.people.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
        linkTo.innerHTML = "";
        if (!people.length) {
          var opt = document.createElement("option");
          opt.textContent = "No one on the tree yet — check back soon";
          opt.disabled = true;
          opt.selected = true;
          linkTo.appendChild(opt);
          return;
        }
        people.forEach(function (p) {
          peopleById[p.id] = p;
          var opt = document.createElement("option");
          opt.value = p.id;
          opt.textContent = personLabel(p);
          linkTo.appendChild(opt);
        });
        linkTo.selectedIndex = 0;
        side.value = peopleById[linkTo.value] ? peopleById[linkTo.value].side : "saif";
        submitBtn.disabled = false;
      }).catch(function (err) {
        statusMsg.className = "status err";
        statusMsg.textContent = "Couldn't load the tree right now — please try again shortly.";
      });

      linkTo.addEventListener("change", function () {
        var p = peopleById[linkTo.value];
        if (p) { side.value = p.side; }
      });

      var loadedAt = Date.now();

      // If the person saved but the relationship request failed, remember
      // them so a retry doesn't create a duplicate pending person —
      // as long as the person's own fields haven't changed since.
      var savedPerson = null;
      function personKey(name, sideVal, isKid, note) {
        return [name, sideVal, isKid ? "1" : "0", note || ""].join("\x00");
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        // silently swallow obvious bot submissions: honeypot filled, or
        // submitted faster than a human could plausibly fill the form
        if (document.getElementById("website").value || Date.now() - loadedAt < 2000) {
          statusMsg.className = "status ok";
          statusMsg.textContent = "Thank you — sent for approval.";
          form.reset();
          return;
        }

        submitBtn.disabled = true;
        statusMsg.className = "status";
        statusMsg.textContent = "Sending…";

        var name = document.getElementById("name").value.trim();
        var relType = document.getElementById("relType").value;
        var isKid = document.getElementById("isKid").checked;
        var note = document.getElementById("note").value.trim();
        var anchorId = linkTo.value;

        if (!name || !anchorId) {
          statusMsg.className = "status err";
          statusMsg.textContent = "Please fill in their name and how they connect.";
          submitBtn.disabled = false;
          return;
        }

        var key = personKey(name, side.value, isKid, note);
        var personPromise;
        if (savedPerson && savedPerson.key === key) {
          // person already saved on a previous half-failed attempt
          personPromise = Promise.resolve({ id: savedPerson.id });
        } else {
          personPromise = TreeData.submitPerson({ name: name, side: side.value, is_kid: isKid, note: note || null })
            .then(function (person) {
              savedPerson = { id: person.id, key: key };
              return person;
            });
        }

        personPromise
          .then(function (person) {
            var relArgs;
            if (relType === "child") {
              relArgs = { from_person: anchorId, to_person: person.id, type: "parent_of" };
            } else if (relType === "parent") {
              relArgs = { from_person: person.id, to_person: anchorId, type: "parent_of" };
            } else if (relType === "sibling") {
              relArgs = { from_person: anchorId, to_person: person.id, type: "sibling_of" };
            } else {
              relArgs = { from_person: anchorId, to_person: person.id, type: "spouse_of" };
            }
            return TreeData.submitRelationship(relArgs);
          })
          .then(function () {
            savedPerson = null;
            statusMsg.className = "status ok";
            statusMsg.textContent = "Thank you — sent for approval.";
            form.reset();
            side.value = peopleById[linkTo.value] ? peopleById[linkTo.value].side : "saif";
            submitBtn.disabled = false;
          })
          .catch(function (err) {
            statusMsg.className = "status err";
            statusMsg.textContent = "Something went wrong — please try again.";
            submitBtn.disabled = false;
          });
      });
    })();
  </script>
</body>
</html>
