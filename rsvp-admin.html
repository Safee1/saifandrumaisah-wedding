<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#faf7f2">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Private admin page for Saif &amp; Rumaisah's wedding site.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://rfopieelzxvnmfhdvqqf.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>RSVPs — Saif &amp; Rumaisah</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="manifest" href="site.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #faf7f2; --card: #fffdf9; --ink: #223049; --muted: #636c7c;
    --accent: #7d95b5; --gold: #b99668; --env: #f5efe4; --side: #40587a;
    --good: #4d7a5a; --bad: #a1503f;
  }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Cormorant Garamond', Georgia, serif; background: var(--bg); color: var(--ink); min-height: 100svh; }

  .gate { min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 2rem 1.25rem; }
  .gate-box { width: 100%; max-width: 340px; text-align: center; }
  .gate-box h1 { font-family: 'Pinyon Script', cursive; font-weight: 400; font-size: 2.2rem; margin: 0 0 1.4rem; }
  .gate-box input { width: 100%; font-family: inherit; font-size: 1rem; padding: 0.7rem 0.9rem; border-radius: 10px; border: 1px solid rgba(64,88,122,0.3); margin-bottom: 0.8rem; }
  .gate-box button { width: 100%; padding: 0.75rem; border: none; border-radius: 10px; background: var(--side); color: #fff; font-family: inherit; font-size: 1rem; letter-spacing: 0.05em; cursor: pointer; }
  .gate-err { color: var(--bad); font-size: 0.85rem; margin-top: 0.6rem; min-height: 1.2em; }

  .app { display: none; max-width: 820px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  .app.show { display: block; }
  .eyebrow { text-align: center; font-size: 0.75rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--muted); margin: 0 0 0.4rem; }
  h1.title { text-align: center; font-family: 'Pinyon Script', cursive; font-weight: 400; font-size: 2.2rem; margin: 0 0 2rem; }

  .summary { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.9rem; margin: 0 0 2rem; }
  .stat { background: var(--card); border: 1px solid rgba(185,150,104,0.3); border-radius: 14px; padding: 1rem 1.4rem; text-align: center; min-width: 9rem; flex: 1 1 9rem; }
  .stat-num { display: block; font-size: 1.7rem; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
  .stat-lab { display: block; font-size: 0.66rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-top: 0.3rem; }

  .empty { text-align: center; color: var(--muted); font-style: italic; padding: 3rem 1rem; }
  .item { background: var(--card); border: 1px solid rgba(185,150,104,0.3); border-radius: 14px; padding: 1.1rem 1.25rem; margin-bottom: 1rem; display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .item-info { flex: 1 1 260px; min-width: 0; }
  .item-kind { font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--side); margin: 0 0 0.25rem; }
  .item-kind.yes { color: var(--good); }
  .item-kind.no { color: var(--bad); }
  .item-main { font-size: 1.1rem; margin: 0; overflow-wrap: anywhere; }
  .item-detail { font-size: 0.88rem; color: var(--ink); margin: 0.3rem 0 0; overflow-wrap: anywhere; }
  .item-note { font-size: 0.85rem; color: var(--muted); font-style: italic; margin: 0.2rem 0 0; overflow-wrap: anywhere; }
  .item-date { font-size: 0.72rem; color: var(--muted); margin: 0.4rem 0 0; }
  .item-actions { display: flex; gap: 0.5rem; }
  .item-actions button { font-family: inherit; font-size: 0.85rem; letter-spacing: 0.05em; border: none; border-radius: 8px; padding: 0.5rem 0.9rem; cursor: pointer; }
  .btn-delete { background: transparent; color: var(--bad); border: 1px solid var(--bad) !important; }
  .item-actions button:disabled { opacity: 0.5; cursor: default; }

  .refresh { display: block; margin: 0 auto 1.5rem; font-family: inherit; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--side); background: none; border: 1px solid var(--side); border-radius: 8px; padding: 0.5rem 1rem; cursor: pointer; }

  .item.is-dupe { opacity: 0.72; }
  .dupe-badge { display: inline-block; font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--bad); border: 1px solid var(--bad); border-radius: 6px; padding: 0.15rem 0.5rem; margin: 0 0 0.35rem; cursor: help; }
  .latest-badge { display: inline-block; font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--good); border: 1px solid var(--good); border-radius: 6px; padding: 0.15rem 0.5rem; margin: 0 0 0.35rem; }
  .dupe-note { text-align: center; color: var(--muted); font-size: 0.78rem; font-style: italic; margin: -1rem 0 1.5rem; }
</style>
</head>
<body>
  <div class="gate" id="gate">
    <div class="gate-box">
      <h1>rsvps</h1>
      <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
      <button id="pwSubmit">Unlock</button>
      <p class="gate-err" id="gateErr"></p>
    </div>
  </div>

  <div class="app" id="app">
    <p class="eyebrow">our wedding</p>
    <h1 class="title">rsvps</h1>
    <p style="text-align:center; margin:-0.5rem 0 1.5rem; font-size:0.8rem;"><a href="admin-activity.html" style="color:var(--side)">View activity log →</a></p>

    <div class="summary" id="summary">
      <div class="stat"><span class="stat-num" id="statTotal">0</span><span class="stat-lab">total responses</span></div>
      <div class="stat"><span class="stat-num" id="statAdults">0</span><span class="stat-lab">adults</span></div>
      <div class="stat"><span class="stat-num" id="statChildren">0</span><span class="stat-lab">children</span></div>
      <div class="stat"><span class="stat-num" id="statAttending">0</span><span class="stat-lab">total headcount</span></div>
      <div class="stat"><span class="stat-num" id="statDeclined">0</span><span class="stat-lab">declined</span></div>
    </div>
    <div class="summary" id="summaryLikelihood">
      <div class="stat"><span class="stat-num" id="statDefinitely">0</span><span class="stat-lab">definitely</span></div>
      <div class="stat"><span class="stat-num" id="statVeryLikely">0</span><span class="stat-lab">very likely</span></div>
      <div class="stat"><span class="stat-num" id="statHopingTo">0</span><span class="stat-lab">hoping to</span></div>
    </div>
    <p class="dupe-note" id="dupeNote" style="display:none"></p>

    <div style="display:flex; gap:0.6rem; justify-content:center; margin-bottom:1.5rem; flex-wrap:wrap;">
      <button class="refresh" id="refreshBtn" style="margin-bottom:0">Refresh</button>
      <button class="refresh" id="exportBtn" style="margin-bottom:0">Export CSV</button>
    </div>
    <div id="list"></div>
  </div>

  <script src="js/rsvp-dupes.js?v=41"></script>
  <script src="js/rsvp-data.js?v=41"></script>
  <script>
    (function () {
      var pw = null;
      var gate = document.getElementById("gate");
      var app = document.getElementById("app");
      var pwInput = document.getElementById("pw");
      var pwSubmit = document.getElementById("pwSubmit");
      var gateErr = document.getElementById("gateErr");
      var list = document.getElementById("list");
      var refreshBtn = document.getElementById("refreshBtn");
      var exportBtn = document.getElementById("exportBtn");
      var statTotal = document.getElementById("statTotal");
      var statAdults = document.getElementById("statAdults");
      var statChildren = document.getElementById("statChildren");
      var statAttending = document.getElementById("statAttending");
      var statDeclined = document.getElementById("statDeclined");
      var statDefinitely = document.getElementById("statDefinitely");
      var statVeryLikely = document.getElementById("statVeryLikely");
      var statHopingTo = document.getElementById("statHopingTo");
      var dupeNote = document.getElementById("dupeNote");
      var lastRows = [];
      var lastEntries = []; // parallel to lastRows: { row, isKeeper, duplicateOf, groupSize }

      var LIKELIHOOD_LABEL = {
        definitely: "Definitely",
        very_likely: "Very likely",
        hoping_to: "Hoping to"
      };

      function fmtDate(iso) {
        try {
          var d = new Date(iso);
          return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) +
                 " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
        } catch (e) { return iso; }
      }

      function unlock() {
        var candidate = pwInput.value;
        if (!candidate) { return; }
        pwSubmit.disabled = true;
        gateErr.textContent = "";
        RsvpData.rpc("admin_list_rsvps", { pw: candidate })
          .then(function (rows) {
            pw = candidate;
            gate.style.display = "none";
            app.classList.add("show");
            try { sessionStorage.setItem("rsvpAdminPw", candidate); } catch (e) {}
            render(rows);
          })
          .catch(function (err) {
            gateErr.textContent = lockoutMessage(err) || "Wrong password.";
            pwSubmit.disabled = false;
          });
      }

      // The DB-side lockout (5 failed admin_check calls in 15 minutes)
      // raises a specific message; surface it as-is instead of the generic
      // "Wrong password." so people know it's a timed lockout, not a typo.
      function lockoutMessage(err) {
        var msg = err && err.message;
        return msg && msg.indexOf("Too many attempts") !== -1 ? msg : null;
      }

      pwSubmit.addEventListener("click", unlock);
      pwInput.addEventListener("keydown", function (e) { if (e.key === "Enter") { unlock(); } });

      function loadList() {
        list.innerHTML = "<p class=\"empty\">Loading…</p>";
        RsvpData.rpc("admin_list_rsvps", { pw: pw }).then(render).catch(function () {
          list.innerHTML = "<p class=\"empty\">Couldn&rsquo;t load &mdash; check the connection and press Refresh.</p>";
        });
      }

      refreshBtn.addEventListener("click", loadList);

      function csvField(value) {
        var s = value == null ? "" : String(value);
        // CSV/formula-injection guard: a leading =, +, -, @, tab or CR lets a
        // cell be read as a formula by Excel/Sheets when the file is opened —
        // neutralise it with a leading apostrophe before any quoting.
        if (/^[=+\-@\t\r]/.test(s)) { s = "'" + s; }
        if (/[",\n]/.test(s)) { s = '"' + s.replace(/"/g, '""') + '"'; }
        return s;
      }

      function exportCsv() {
        var header = ["Name", "Attending", "Contact", "Adults", "Children", "Guests", "Likelihood", "Dietary", "Note", "Submitted", "duplicate_of"];
        var lines = [header.join(",")];
        lastEntries.forEach(function (entry) {
          var row = entry.row;
          var dupOf = entry.duplicateOf ? (entry.duplicateOf.name + " (" + fmtDate(entry.duplicateOf.created_at) + ")") : "";
          lines.push([
            csvField(row.name),
            csvField(row.attending ? "Yes" : "No"),
            csvField(row.contact),
            csvField(row.adults),
            csvField(row.children),
            csvField(row.attending ? row.guest_count : ""),
            csvField(LIKELIHOOD_LABEL[row.likelihood] || row.likelihood),
            csvField(row.dietary),
            csvField(row.message),
            csvField(fmtDate(row.created_at)),
            csvField(dupOf)
          ].join(","));
        });
        var blob = new Blob([lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "rsvps.csv";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      exportBtn.addEventListener("click", exportCsv);

      function render(rows) {
        lastRows = rows;
        var entries = RsvpDupes.groupDuplicates(rows);
        lastEntries = entries;

        var totalResponses = 0;
        var totalAttendingGuests = 0;
        var totalAdults = 0;
        var totalChildren = 0;
        var totalDeclined = 0;
        var excludedCount = 0;
        var byLikelihood = { definitely: 0, very_likely: 0, hoping_to: 0 };
        entries.forEach(function (entry) {
          if (!entry.isKeeper) { excludedCount += 1; return; }
          var row = entry.row;
          totalResponses += 1;
          if (row.attending) {
            totalAttendingGuests += (row.guest_count || 0);
            totalAdults += (row.adults || 0);
            totalChildren += (row.children || 0);
            if (row.likelihood && byLikelihood.hasOwnProperty(row.likelihood)) {
              byLikelihood[row.likelihood] += 1;
            }
          } else {
            totalDeclined += 1;
          }
        });
        statTotal.textContent = totalResponses;
        statAdults.textContent = totalAdults;
        statChildren.textContent = totalChildren;
        statAttending.textContent = totalAttendingGuests;
        statDeclined.textContent = totalDeclined;
        statDefinitely.textContent = byLikelihood.definitely;
        statVeryLikely.textContent = byLikelihood.very_likely;
        statHopingTo.textContent = byLikelihood.hoping_to;

        if (excludedCount > 0) {
          dupeNote.textContent = excludedCount + " possible duplicate" + (excludedCount === 1 ? "" : "s") + " excluded";
          dupeNote.style.display = "";
        } else {
          dupeNote.textContent = "";
          dupeNote.style.display = "none";
        }

        list.innerHTML = "";
        if (!rows.length) {
          list.innerHTML = "<p class=\"empty\">No RSVPs yet.</p>";
          return;
        }
        entries.forEach(function (entry) {
          var row = entry.row;
          var el = document.createElement("div");
          el.className = "item" + (entry.isKeeper ? "" : " is-dupe");

          var info = document.createElement("div");
          info.className = "item-info";

          if (!entry.isKeeper && entry.duplicateOf) {
            var dupeBadge = document.createElement("span");
            dupeBadge.className = "dupe-badge";
            dupeBadge.textContent = "Possible duplicate";
            dupeBadge.title = "of " + entry.duplicateOf.name;
            info.appendChild(dupeBadge);
            var dupeOfText = document.createElement("p");
            dupeOfText.className = "item-note";
            dupeOfText.style.margin = "0 0 0.3rem";
            dupeOfText.textContent = "of " + entry.duplicateOf.name;
            info.appendChild(dupeOfText);
          } else if (entry.isKeeper && entry.groupSize > 1) {
            var latestBadge = document.createElement("span");
            latestBadge.className = "latest-badge";
            latestBadge.textContent = "latest";
            info.appendChild(latestBadge);
          }

          var kind = document.createElement("p");
          kind.className = "item-kind " + (row.attending ? "yes" : "no");
          kind.textContent = row.attending ? "attending" : "not attending";

          var main = document.createElement("p");
          main.className = "item-main";
          main.textContent = row.name;

          info.appendChild(kind);
          info.appendChild(main);

          if (row.likelihood && LIKELIHOOD_LABEL[row.likelihood]) {
            var likelihood = document.createElement("p");
            likelihood.className = "item-detail";
            likelihood.textContent = LIKELIHOOD_LABEL[row.likelihood];
            info.appendChild(likelihood);
          }
          if (row.attending) {
            var guests = document.createElement("p");
            guests.className = "item-detail";
            guests.textContent = "Adults: " + (row.adults != null ? row.adults : "—") +
              "  ·  Children: " + (row.children != null ? row.children : "—") +
              "  ·  Total: " + row.guest_count;
            info.appendChild(guests);
          }
          if (row.contact) {
            var contact = document.createElement("p");
            contact.className = "item-detail";
            contact.textContent = "Contact: " + row.contact;
            info.appendChild(contact);
          }
          if (row.dietary) {
            var dietary = document.createElement("p");
            dietary.className = "item-detail";
            dietary.textContent = "Dietary: " + row.dietary;
            info.appendChild(dietary);
          }
          if (row.message) {
            var msg = document.createElement("p");
            msg.className = "item-note";
            msg.textContent = "“" + row.message + "”";
            info.appendChild(msg);
          }
          var date = document.createElement("p");
          date.className = "item-date";
          date.textContent = fmtDate(row.created_at);
          info.appendChild(date);

          var actions = document.createElement("div");
          actions.className = "item-actions";
          var deleteBtn = document.createElement("button");
          deleteBtn.className = "btn-delete";
          deleteBtn.textContent = "Delete";
          deleteBtn.addEventListener("click", function () {
            if (!confirm("Delete this RSVP from " + row.name + "?")) { return; }
            deleteBtn.disabled = true;
            RsvpData.rpc("admin_delete_rsvp", { pw: pw, target: row.id })
              .then(function () {
                el.remove();
                loadList();
              })
              .catch(function () {
                deleteBtn.disabled = false;
                alert("Something went wrong — please try again.");
              });
          });
          actions.appendChild(deleteBtn);

          el.appendChild(info);
          el.appendChild(actions);
          list.appendChild(el);
        });
      }

      try {
        var saved = sessionStorage.getItem("rsvpAdminPw");
        if (saved) { pwInput.value = saved; unlock(); }
      } catch (e) {}
    })();
  </script>
</body>
</html>
